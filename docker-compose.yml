version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend/database:/app/database # Persist SQLite DB
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban_frontend
    ports:
      - "5173:80" # Map container port 80 to host 5173 to keep same URLs
    depends_on:
      - backend
